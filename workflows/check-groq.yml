# ============================================================
# Quick check: is GROQ_API_KEY valid? (never prints the key)
# Manual dispatch only. Needs repo secret: GROQ_API_KEY
# ============================================================
name: check-groq-key

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Validate GROQ_API_KEY
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          if [ -z "$GROQ_API_KEY" ]; then
            echo "GROQ_API_KEY secret is missing or empty."
            exit 1
          fi
          echo "Secret length: ${#GROQ_API_KEY} characters"
          case "$GROQ_API_KEY" in
            gsk_*) echo "Format: starts with gsk_ (looks right)" ;;
            *) echo "Format: does NOT start with gsk_ (wrong value pasted?)"; exit 1 ;;
          esac
          CODE=$(curl -s -o /tmp/out.json -w "%{http_code}" \
            -H "Authorization: Bearer $GROQ_API_KEY" \
            https://api.groq.com/openai/v1/models)
          echo "Groq API responded with HTTP $CODE"
          if [ "$CODE" = "200" ]; then
            echo "GROQ_API_KEY is valid."
            python3 -c "import json; d=json.load(open('/tmp/out.json')); print('models available:', len(d.get('data', [])))"
          else
            echo "Key invalid or API error. Response:"
            head -c 500 /tmp/out.json
            echo
            exit 1
          fi
